spring:
  application:
    name: skool
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SKOOL_DB_URL:jdbc:postgresql://localhost:5432/skool}
    username: ${SKOOL_DB_USER:skool}
    password: ${SKOOL_DB_PASSWORD:skool}
    hikari:
      maximum-pool-size: 20
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Africa/Luanda
  flyway:
    enabled: true
    locations: classpath:db/migration/common,classpath:db/migration/identity,classpath:db/migration/academic_structure,classpath:db/migration/sis,classpath:db/migration/staff,classpath:db/migration/attendance,classpath:db/migration/grading,classpath:db/migration/assessment,classpath:db/migration/assignments,classpath:db/migration/forum,classpath:db/migration/subject_board,classpath:db/migration/fees,classpath:db/migration/notifications,classpath:db/migration/documents,classpath:db/migration/reporting
  messages:
    basename: messages/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  web:
    locale: pt_AO
    locale-resolver: fixed

server:
  port: ${SKOOL_PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

skool:
  locale:
    default: pt-AO
    supported: pt-AO,en
  storage:
    minio:
      endpoint: ${SKOOL_MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${SKOOL_MINIO_ACCESS_KEY:skool}
      secret-key: ${SKOOL_MINIO_SECRET_KEY:skool-dev-secret}
      bucket: ${SKOOL_MINIO_BUCKET:skool}
  security:
    jwt:
      issuer: skool
      # Dev default only. Override via SKOOL_JWT_SECRET in prod (min 32 bytes).
      secret: ${SKOOL_JWT_SECRET:dev-only-secret-do-not-use-in-production-32bytes}
      access-token-ttl: PT30M
      refresh-token-ttl: P30D
