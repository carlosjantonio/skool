spring:
  datasource:
    url: jdbc:h2:mem:skool_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

skool:
  demo:
    seed: false
  security:
    jwt:
      secret: test-jwt-secret-at-least-32-bytes-long-for-hmac-sha-256
