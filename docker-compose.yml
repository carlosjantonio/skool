services:
  postgres:
    image: postgres:16-alpine
    container_name: skool-postgres
    environment:
      POSTGRES_DB: skool
      POSTGRES_USER: skool
      POSTGRES_PASSWORD: skool
      TZ: Africa/Luanda
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skool -d skool"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: skool-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: skool
      MINIO_ROOT_PASSWORD: skool-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skool-app
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SKOOL_DB_URL: jdbc:postgresql://postgres:5432/skool
      SKOOL_DB_USER: skool
      SKOOL_DB_PASSWORD: skool
      SKOOL_PORT: "8080"
      SPRING_PROFILES_ACTIVE: dev
      TZ: Africa/Luanda
    ports:
      - "8080:8080"
    profiles: ["full"]

volumes:
  postgres-data:
  minio-data:
